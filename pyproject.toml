[project]
name = "cltrplusf"
version = "0.1.0"
description = "Find anything in a company's filings: PDFs parsed with every number kept, chunked, and searched."
readme = "README.md"
authors = [
    { name = "vedantdeo", email = "vedantdeo1@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.140.0",
    "numpy>=2.5.3",
    "pypdf>=6.18.1",
    "pypdfium2>=4",
    "sentence-transformers>=6.0.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
